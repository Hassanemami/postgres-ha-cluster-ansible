[defaults]
inventory       = inventory/hosts.yml
roles_path      = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# community.general's "yaml" stdout callback was removed in
# community.general 12; ansible-core has had the same output built in since
# 2.13 via result_format.
stdout_callback = default
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
