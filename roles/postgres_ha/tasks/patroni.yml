---
- name: Install Patroni
  ansible.builtin.package:
    name: "{{ __patroni_packages }}"
    state: "{{ pkg_install_state }}"

- name: Compute memory-based tuning
  ansible.builtin.import_tasks: memory_tuning.yml

- name: Create Patroni config directory
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Ensure the Patroni systemd unit points at our config file
  # The Debian and PGDG packages ship slightly different unit files; a
  # drop-in keeps our config path consistent across both without editing
  # a vendor-managed unit.
  ansible.builtin.file:
    path: /etc/systemd/system/patroni.service.d
    state: directory
    mode: "0755"

- name: Deploy the Patroni systemd drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/patroni {{ patroni_config_dir }}/config.yml
    mode: "0644"
  notify:
    - Reload systemd
    - Restart patroni
