---
# Host-level tuning for a dedicated database server.

- name: Disable transparent huge pages at runtime
  # THP causes unpredictable latency spikes in PostgreSQL because of the
  # cost of compacting/defragmenting under memory pressure.
  ansible.builtin.shell: |
    echo never > /sys/kernel/mm/transparent_hugepage/enabled
    echo never > /sys/kernel/mm/transparent_hugepage/defrag
  changed_when: true
  failed_when: false
  when: disable_transparent_hugepages | bool

- name: Persist the transparent huge pages setting across reboots
  ansible.builtin.copy:
    dest: /etc/systemd/system/disable-thp.service
    mode: "0644"
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages
      After=sysinit.target local-fs.target
      Before=postgresql.service patroni.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c "echo never > /sys/kernel/mm/transparent_hugepage/enabled"
      ExecStart=/bin/sh -c "echo never > /sys/kernel/mm/transparent_hugepage/defrag"
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: disable_transparent_hugepages | bool
  notify: Reload systemd

- name: Enable the THP-disabling unit
  ansible.builtin.systemd:
    name: disable-thp
    enabled: true
    daemon_reload: true
  when: disable_transparent_hugepages | bool

- name: Warn when vm.overcommit_memory=2 would leave too little commit space
  # With overcommit_memory=2 the kernel refuses any allocation past
  # swap + RAM*overcommit_ratio/100. On a host with little or no swap that
  # ceiling can sit below what PostgreSQL (plus anything else on the box -
  # a Rust build, a backup, an exporter) actually wants, and allocations
  # start failing with ENOMEM instead of being reclaimed.
  ansible.builtin.debug:
    msg: >-
      vm.overcommit_memory=2 with ratio {{ vm_overcommit_ratio }} on a host
      with {{ ansible_memtotal_mb }}MB RAM and
      {{ ansible_swaptotal_mb | default(0) }}MB swap allows about
      {{ ((ansible_memtotal_mb | int * vm_overcommit_ratio | int / 100) + (ansible_swaptotal_mb | default(0) | int)) | int }}MB
      of committed memory, while shared_buffers alone is {{ shared_buffers | default('unset') }}.
      Add swap, lower pg_memory_budget_percent, or set
      vm_overcommit_memory: 0 in group_vars.
  when:
    - tune_kernel_parameters | bool
    - vm_overcommit_memory | int == 2
    - ((ansible_memtotal_mb | int * vm_overcommit_ratio | int / 100) + (ansible_swaptotal_mb | default(0) | int))
      < (ansible_memtotal_mb | int * 0.9)

- name: Apply kernel parameters for PostgreSQL
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/30-postgresql.conf
    state: present
    reload: true
  loop: "{{ pg_sysctl_parameters }}"
  loop_control:
    label: "{{ item.name }}={{ item.value }}"
  when: tune_kernel_parameters | bool

- name: Raise file descriptor and process limits for postgres
  community.general.pam_limits:
    domain: postgres
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { type: "soft", item: "nofile", value: "65536" }
    - { type: "hard", item: "nofile", value: "65536" }
    - { type: "soft", item: "nproc", value: "16384" }
    - { type: "hard", item: "nproc", value: "16384" }
  when: tune_kernel_parameters | bool
