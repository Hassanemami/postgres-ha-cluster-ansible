---
# Stanza creation, verification and scheduled backups. Runs after Patroni
# has bootstrapped the cluster (the stanza needs a live PostgreSQL).

- name: Configure pgBackRest stanza and schedules
  when: pgbackrest_enabled | bool
  block:
    # --- migration off the default /tmp lock path ---------------------------

    - name: Check whether any pgBackRest process is running
      ansible.builtin.command: pgrep -x pgbackrest
      register: pgbackrest_running
      changed_when: false
      failed_when: false

    - name: Remove locks left behind in the old /tmp/pgbackrest lock path
      # pgBackRest's built-in default lock-path is /tmp/pgbackrest. Async
      # archive-push processes that failed (typically because archiving
      # started before the stanza existed) leave lock files there, and with
      # PrivateTmp units in the mix they are invisible to a hand-run
      # pgbackrest - which is how a cluster ends up wedged on "unable to
      # acquire lock". We now set lock-path explicitly, so the old directory
      # is just litter; clear it, but only while nothing is running.
      ansible.builtin.file:
        path: /tmp/pgbackrest
        state: absent
      when:
        - pgbackrest_lock_path != '/tmp/pgbackrest'
        - pgbackrest_running.rc != 0

    # --- stanza creation: leader only, and only once ------------------------

    - name: Check whether the pgBackRest stanza already exists
      ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} info --output=json"
      become: true
      become_user: postgres
      register: pgbackrest_info
      changed_when: false
      failed_when: false

    - name: Create the pgBackRest stanza on the leader
      # Retried: with a cluster-aware stanza, stanza-create talks to every
      # pg<n>-host, and on a first run a replica may still be cloning. A
      # few retries beat failing the whole play over a node that is 20
      # seconds from ready.
      ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} --log-level-console=info stanza-create"
      become: true
      become_user: postgres
      register: pgbackrest_stanza_create
      changed_when: "'completed successfully' in pgbackrest_stanza_create.stderr | default('')"
      failed_when: false
      retries: 5
      delay: 15
      until: pgbackrest_stanza_create.rc == 0
      when:
        - inventory_hostname == patroni_leader | default('')
        - "'[]' in pgbackrest_info.stdout or pgbackrest_info.rc != 0"

    - name: Fail with the pgBackRest stanza-create output
      ansible.builtin.fail:
        msg: |-
          stanza-create failed on {{ inventory_hostname }}. Backups and PITR
          are not working. See docs/troubleshooting.md.

          {{ pgbackrest_stanza_create.stderr | default(pgbackrest_stanza_create.stdout | default('no output')) }}
      when:
        - pgbackrest_stanza_create.rc | default(0) != 0

    - name: Verify the pgBackRest configuration end to end
      # `check` proves archive_command actually works and the repo is
      # writable. If this fails, archiving is silently broken and you have
      # no recoverable backups - better to find out now.
      ansible.builtin.command: "pgbackrest --stanza={{ pgbackrest_stanza }} --log-level-console=info check"
      become: true
      become_user: postgres
      register: pgbackrest_check
      changed_when: false
      failed_when: false
      when: inventory_hostname == patroni_leader | default('')

    - name: Report pgBackRest check result
      ansible.builtin.debug:
        msg: >-
          {{ 'pgBackRest check PASSED - archiving and repo are working.'
             if pgbackrest_check.rc | default(1) == 0
             else 'pgBackRest check FAILED. Backups/PITR are NOT working. Output: '
                  + (pgbackrest_check.stderr | default('n/a')) }}
      when: inventory_hostname == patroni_leader | default('')

    - name: Confirm WAL archiving is actually moving
      # archive_command has been live since Patroni bootstrapped, so any WAL
      # produced before the stanza existed failed to push. Once the stanza is
      # there PostgreSQL retries automatically; a non-zero failed_count that
      # keeps growing across runs means archiving is still broken.
      ansible.builtin.command: >-
        {{ pg_bin_dir }}/psql -tAc
        "SELECT archived_count, failed_count, last_failed_time FROM pg_stat_archiver"
      become: true
      become_user: postgres
      register: pg_archiver_stat
      changed_when: false
      failed_when: false
      when: inventory_hostname == patroni_leader | default('')

    - name: Report the archiver state
      ansible.builtin.debug:
        msg: "pg_stat_archiver (archived_count|failed_count|last_failed_time): {{ pg_archiver_stat.stdout | default('n/a') | trim }}"
      when: inventory_hostname == patroni_leader | default('')

    # --- scheduled backups --------------------------------------------------

    - name: Deploy the backup wrapper script
      ansible.builtin.copy:
        dest: /usr/local/bin/pgbackrest-backup.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Run a pgBackRest backup, but only on the current Patroni leader.
          # Every node has the timer enabled; only one acts on it.
          set -euo pipefail
          TYPE="${1:-incr}"
          ROLE=$(curl -s -o /dev/null -w '%{http_code}' \
                 "http://127.0.0.1:{{ patroni_api_port }}/primary" || echo 000)
          if [ "$ROLE" != "200" ]; then
            echo "Not the leader (health check returned $ROLE); skipping backup."
            exit 0
          fi
          exec sudo -u postgres pgbackrest --stanza={{ pgbackrest_stanza }} \
               --type="$TYPE" --log-level-console=info backup
      when: pgbackrest_schedule_enabled | bool

    - name: Deploy backup systemd units
      ansible.builtin.copy:
        dest: "/etc/systemd/system/pgbackrest-{{ item.name }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=pgBackRest {{ item.name }} backup
          After=patroni.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/pgbackrest-backup.sh {{ item.type }}
      loop:
        - { name: full, type: full }
        - { name: diff, type: diff }
      when: pgbackrest_schedule_enabled | bool
      notify: Reload systemd

    - name: Deploy backup systemd timers
      ansible.builtin.copy:
        dest: "/etc/systemd/system/pgbackrest-{{ item.name }}.timer"
        mode: "0644"
        content: |
          [Unit]
          Description=Schedule pgBackRest {{ item.name }} backup

          [Timer]
          OnCalendar={{ item.schedule }}
          Persistent=true
          RandomizedDelaySec=300

          [Install]
          WantedBy=timers.target
      loop:
        - { name: full, schedule: "{{ pgbackrest_full_backup_schedule }}" }
        - { name: diff, schedule: "{{ pgbackrest_diff_backup_schedule }}" }
      when: pgbackrest_schedule_enabled | bool
      notify: Reload systemd

    - name: Enable backup timers
      ansible.builtin.systemd:
        name: "pgbackrest-{{ item }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - full
        - diff
      when: pgbackrest_schedule_enabled | bool
