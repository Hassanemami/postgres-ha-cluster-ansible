---
# Real WAL archiving and backups. Streaming replicas are NOT a backup:
# they replicate DROP TABLE just as faithfully as anything else.

- name: Set up pgBackRest
  when: pgbackrest_enabled | bool
  block:
    - name: Install pgBackRest
      ansible.builtin.package:
        name: "{{ __pgbackrest_packages }}"
        state: "{{ pkg_install_state }}"

    - name: Create pgBackRest directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"
      loop:
        - "{{ pgbackrest_repo_path }}"
        - "{{ pgbackrest_spool_path }}"
        - "{{ pgbackrest_log_path }}"
        - "{{ pgbackrest_lock_path }}"
        - /etc/pgbackrest
        - /etc/pgbackrest/conf.d

    - name: Recreate the lock directory on every boot
      # pgbackrest_lock_path defaults to somewhere under /run, which is a
      # tmpfs. See the lock-path comment in pgbackrest.conf.j2 for why the
      # default /tmp/pgbackrest is a bad place for it.
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/pgbackrest.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible - do not edit by hand.
          d {{ pgbackrest_lock_path }} 0750 postgres postgres - -
      when: pgbackrest_lock_path is match('/run/.*|/var/run/.*')

    - name: Deploy pgbackrest.conf
      ansible.builtin.template:
        src: pgbackrest.conf.j2
        dest: /etc/pgbackrest/pgbackrest.conf
        owner: postgres
        group: postgres
        mode: "0640"

    - name: Deploy logrotate config for pgBackRest
      ansible.builtin.copy:
        dest: /etc/logrotate.d/pgbackrest
        mode: "0644"
        content: |
          {{ pgbackrest_log_path }}/*.log {
              daily
              rotate 14
              compress
              missingok
              notifempty
              su postgres postgres
          }

    - name: Set up SSH between the postgres users for multi-host pgBackRest
      ansible.builtin.import_tasks: pgbackrest_ssh.yml
      when:
        - is_cluster | bool
        - pgbackrest_cluster_aware | bool
        - pgbackrest_manage_ssh_keys | bool
        - ansible_play_hosts | length > 1
