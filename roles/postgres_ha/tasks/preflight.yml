---
# Cheap checks that catch the failure modes which are painful to debug once
# the cluster is half-built.

- name: Fail early on an unsupported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: >-
      This role supports Debian-family and RedHat-family hosts only.
      Detected: {{ ansible_distribution }} ({{ ansible_os_family }}).

- name: Validate deployment_mode and connection_mode
  ansible.builtin.assert:
    that:
      - deployment_mode in ['cluster', 'single_node']
      - connection_mode in ['haproxy', 'pgcat']
    fail_msg: >-
      deployment_mode must be 'cluster' or 'single_node' (got
      '{{ deployment_mode }}'); connection_mode must be 'haproxy' or 'pgcat'
      (got '{{ connection_mode }}'). See the top of defaults/main.yml or
      docs/PLANNING.md.
  run_once: true

- name: Require exactly one host for single_node
  ansible.builtin.assert:
    that:
      - groups['all'] | length == 1
    fail_msg: >-
      deployment_mode is 'single_node' but the inventory has
      {{ groups['all'] | length }} hosts. Either set deployment_mode:
      cluster to use all of them with Patroni/etcd, or trim the inventory
      to the one host you actually want.
  run_once: true
  when: not is_cluster

- name: Require an odd number of at least 3 hosts for cluster mode
  ansible.builtin.assert:
    that:
      - groups['all'] | length is odd
      - groups['all'] | length >= 3
    fail_msg: >-
      etcd needs an odd number of members (3, 5, 7) to hold quorum, and at
      least 3 for any fault tolerance at all. Found {{ groups['all'] | length }}.
      A 2-node cluster cannot survive a single failure - it loses quorum.
      (Only one node? Set deployment_mode: single_node instead.)
    success_msg: "{{ groups['all'] | length }} nodes - quorum tolerates {{ ((groups['all'] | length - 1) / 2) | int }} failure(s)."
  run_once: true
  when: is_cluster

- name: Fail if secrets were left at their placeholder values
  ansible.builtin.assert:
    that:
      - vault_postgres_superuser_password != "CHANGE_ME"
      - (not use_pgbouncer) or vault_pgbouncer_password != "CHANGE_ME"
      - (not is_cluster) or vault_postgres_replicator_password != "CHANGE_ME"
      - (not is_cluster) or not (patroni_restapi_auth_enabled | bool) or vault_patroni_restapi_password != "CHANGE_ME"
      - (not use_pgcat) or vault_pgcat_admin_password != "CHANGE_ME"
    fail_msg: >-
      One or more secrets are still "CHANGE_ME". Create and encrypt
      group_vars/all/vault.yml (see vault.yml.example) before deploying.
    quiet: true

- name: Fail if keepalived is enabled without a VIP
  ansible.builtin.assert:
    that:
      - keepalived_vip | length > 0
      - vault_keepalived_auth_pass != "CHANGE_ME"
    fail_msg: >-
      keepalived_enabled is true but keepalived_vip is unset (or the auth
      password is still CHANGE_ME). Set a free address in your subnet, or
      set keepalived_enabled: false if you front the cluster some other way.
  when: use_keepalived

- name: Verify every node can resolve every other node
  ansible.builtin.assert:
    that:
      - hostvars[item]['ansible_host'] is defined
    fail_msg: "Host {{ item }} has no ansible_host set in the inventory."
  loop: "{{ groups['all'] }}"

# ---------------------------------------------------------------------------
# Outbound network access
# ---------------------------------------------------------------------------
# This role pulls from several places on the public internet. Behind a
# restrictive network (or sanctions-based geoblocking) the run otherwise
# fails halfway through, with a half-built cluster. Check first and say
# exactly which endpoint is unreachable so a mirror can be configured
# before anything is installed. See docs/offline-and-mirrors.md.

- name: Check outbound access to the endpoints this run needs
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: HEAD
    timeout: "{{ preflight_connectivity_timeout }}"
    status_code: [200, 301, 302, 400, 401, 403, 405]
  loop: "{{ preflight_required_endpoints }}"
  loop_control:
    label: "{{ item.what }}"
  register: preflight_connectivity
  changed_when: false
  failed_when: false
  when: preflight_check_connectivity | bool

- name: Collect the endpoints that did not answer
  ansible.builtin.set_fact:
    preflight_unreachable: "{{ preflight_unreachable | default([]) + [item.item.what ~ ' -> ' ~ item.item.url] }}"
  loop: "{{ preflight_connectivity.results | default([]) }}"
  loop_control:
    label: "{{ item.item.what | default('?') }}"
  when:
    - preflight_check_connectivity | bool
    - item.status | default(-1) not in [200, 301, 302, 400, 401, 403, 405]

- name: Fail when a required source is unreachable
  ansible.builtin.fail:
    msg: |-
      {{ inventory_hostname }} cannot reach some of the sources this run
      needs:
      {% for endpoint in preflight_unreachable %}
        - {{ endpoint }}
      {% endfor %}
      Configure a local mirror (see docs/offline-and-mirrors.md) or set
      preflight_check_connectivity: false to proceed anyway.
  when: preflight_unreachable | default([]) | length > 0

- name: Ensure a time sync daemon is installed
  ansible.builtin.package:
    name: chrony
    state: present
  when: manage_time_sync | bool

- name: Ensure the time sync daemon is running
  # Clock skew between nodes makes Patroni TTL behaviour and correlated log
  # analysis extremely confusing to debug.
  ansible.builtin.systemd:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: started
    enabled: true
  when: manage_time_sync | bool
  failed_when: false

- name: Report deployment plan
  ansible.builtin.debug:
    msg:
      - "Mode:      {{ deployment_mode }}{{ ' (' + connection_mode + ')' if is_cluster else '' }}"
      - "Nodes:     {{ groups['all'] | length }}"
      - "This node: {{ inventory_hostname }} ({{ ansible_default_ipv4.address }})"
      - "OS:        {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
      - "Backups:   {{ 'pgBackRest stanza ' + pgbackrest_stanza if pgbackrest_enabled else 'NONE - no PITR!' }}"
      - "{{ ['Sync mode: ' ~ patroni_synchronous_mode ~ ' (strict=' ~ patroni_synchronous_mode_strict ~ ')',
             'Failsafe:  ' ~ patroni_failsafe_mode ~ ' | Watchdog: ' ~ (patroni_watchdog_mode if use_watchdog else 'off'),
             'VIP:       ' ~ (keepalived_vip if use_keepalived else 'none')]
           if is_cluster else ['(single node - no failover, no VIP, no watchdog)'] }}"
  run_once: true
