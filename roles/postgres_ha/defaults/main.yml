---
# defaults for postgres_ha
#
# Values written as "{{ __something }}" come from vars/<os_family>.yml
# (Debian.yml / RedHat.yml), loaded at run time by tasks/main.yml.

# ============================================================================
# THE TWO DECISIONS THAT SHAPE EVERYTHING ELSE
# ============================================================================
# Answer these two questions and the role configures itself accordingly -
# you shouldn't need to touch much else for a first deployment. See
# docs/PLANNING.md for the full decision guide, or run ./plan.py for an
# interactive wizard that sets these (and the inventory) for you.

# "cluster"     - Patroni + etcd + automatic failover across 3+ nodes.
# "single_node" - one plain PostgreSQL instance, no etcd/Patroni/watchdog/
#                 keepalived/HAProxy/PgCat. Still gets PgBouncer pooling,
#                 pgBackRest backups, and monitoring - just no HA machinery.
#                 Use this for dev/staging or a first deployment; you can
#                 grow into "cluster" later, but that migration is a manual
#                 "add replicas and let Patroni adopt the primary" exercise,
#                 not a flip of this variable.
deployment_mode: "cluster"

# Only read when deployment_mode == "cluster". Ignored for single_node.
# "haproxy" - the classic Patroni pattern: HAProxy exposes separate
#             primary/replica ports (5000/5001/...), PgBouncer pools each
#             node's local connections. Full SCRAM auth end-to-end. Two
#             connection pools in your app - see the main README.
# "pgcat"   - PgCat parses every query and routes it itself over ONE
#             connection - see docs/PGCAT.md. Replaces HAProxy's read/write
#             listeners AND PgBouncer entirely (PgCat pools its own
#             connections to Postgres directly), so this role does not
#             install either when you choose this. Client auth is MD5, not
#             SCRAM - see docs/PGCAT.md before choosing this for anything
#             with strict auth requirements. keepalived (if enabled) health
#             checks PgCat directly instead of HAProxy in this mode.
connection_mode: "haproxy"

# Applied via ALTER SYSTEM in single_node mode only (the cluster path gets
# the much larger tuned parameter set from Patroni's config.yml.j2
# instead). shared_buffers/effective_cache_size/work_mem come from
# tasks/memory_tuning.yml, computed from actual host RAM.
standalone_postgresql_parameters:
  shared_buffers: "{{ shared_buffers }}"
  effective_cache_size: "{{ effective_cache_size }}"
  work_mem: "{{ work_mem }}"
  maintenance_work_mem: "1GB"
  max_connections: "{{ pg_max_connections }}"
  password_encryption: "scram-sha-256"
  wal_level: "replica"
  max_wal_senders: "10"
  checkpoint_completion_target: "0.9"
  random_page_cost: "1.1"
  effective_io_concurrency: "200"
  shared_preload_libraries: "pg_stat_statements"
  log_min_duration_statement: "1000"
  log_line_prefix: "%m [%p] %r %q%u@%d "
  ssl: "{{ 'on' if pg_ssl_enabled else 'off' }}"

# ============================================================================
# Package / version management
# ============================================================================
# When true, every run installs packages with state: latest - so a routine
# "re-run the playbook to change one setting" also upgrades PostgreSQL,
# Patroni, PgBouncer and HAProxy underneath a live cluster, restarting
# services as a side effect. Default false: install once, upgrade when you
# decide to, not when you happen to run Ansible.
auto_update_packages: false
pg_version: "auto"

# Extra OS repositories (RedHat family only, no-op on Debian).
# EL9's pgbackrest RPM pulls in libssh2, which lives in CRB, and a few
# optional dependencies come from EPEL. Without these, the pgBackRest
# install fails mid-run on an unresolved dependency.
manage_os_repos: true
epel_enabled: true
# Point this at a local mirror (a full URL to an epel-release rpm works) on
# hosts that cannot reach dl.fedoraproject.org.
epel_release_package: "epel-release"

pg_data_dir: "{{ __pg_data_dir }}"
pg_bin_dir: "{{ __pg_bin_dir }}"
pg_config_dir: "{{ __pg_config_dir }}"

# Pinned, not "latest". Tracking latest means a minor bump (3.5 -> 3.6 ->
# 3.7) can land on a live cluster on an unrelated re-run, skipping the
# documented upgrade path. Change this deliberately, one step at a time.
# Set to "latest" to restore the old auto-tracking behaviour.
etcd_version: "v3.6.14"
etcd_data_dir: "/var/lib/etcd"
etcd_config_dir: "/etc/etcd"
etcd_user: "etcd"

patroni_scope: "postgres-cluster"
patroni_namespace: "/service"
patroni_config_dir: "/etc/patroni"

pgbouncer_user: "{{ __pgbouncer_user }}"
pgbouncer_conf_dir: "{{ __pgbouncer_conf_dir }}"

# ============================================================================
# Ports
# ============================================================================
etcd_client_port: 2379
etcd_peer_port: 2380
etcd_metrics_port: 2381
patroni_api_port: 8008
postgresql_port: 5432
pgbouncer_port: 6432
haproxy_stats_port: 7000
haproxy_primary_port: 5000
haproxy_replicas_port: 5001
haproxy_replicas_sync_port: 5002
haproxy_replicas_async_port: 5003
postgres_exporter_port: 9187
node_exporter_port: 9100

# ============================================================================
# High availability behaviour
# ============================================================================
# DCS Failsafe Mode. Without this, if etcd becomes unreachable the whole
# cluster drops to read-only even when every PostgreSQL node is healthy.
# With it on, the leader keeps accepting writes as long as it can still
# reach every known member over the Patroni REST API. Strongly recommended.
patroni_failsafe_mode: true

# Synchronous replication. "quorum" (Patroni 4.x) gives the best balance of
# durability and availability; "on" is classic sync mode; "off" trades
# durability for availability. With synchronous_mode_strict, writes BLOCK
# when no sync standby is available - that is the point (no silent data
# loss), but make sure you actually want it.
patroni_synchronous_mode: "quorum"
patroni_synchronous_mode_strict: true
patroni_synchronous_node_count: 1

patroni_ttl: 30
patroni_loop_wait: 10
patroni_retry_timeout: 10
patroni_maximum_lag_on_failover: 1048576
patroni_primary_start_timeout: 300
# Effective only with synchronous_mode on; SIGKILLs the postmaster if a
# shutdown drags past this, so a stuck primary can't block failover forever.
patroni_primary_stop_timeout: 300

# ----------------------------------------------------------------------------
# Watchdog (STONITH / fencing)
# ----------------------------------------------------------------------------
# Last line of defence against split-brain. If Patroni itself hangs, is
# OOM-killed, or the VM is frozen by the hypervisor, PostgreSQL could keep
# accepting writes after the leader lock expired. The watchdog resets the
# whole box instead.
#
# mode "required" = refuse to become leader if the watchdog can't be armed.
# That is the correct enterprise setting, but it will HARD RESET the node
# on failure - verify /dev/watchdog works on every node first.
# Use "automatic" to arm it when available and carry on when it isn't.
patroni_watchdog_enabled: true
patroni_watchdog_mode: "automatic"   # off | automatic | required
patroni_watchdog_device: "/dev/watchdog"
patroni_watchdog_safety_margin: 5
# Load the kernel softdog module if no hardware watchdog is present.
# On bare metal prefer a real hardware watchdog (ipmi_watchdog, iTCO_wdt).
patroni_watchdog_use_softdog: true

# ============================================================================
# Security
# ============================================================================
# Patroni's REST API "unsafe" endpoints (POST/PUT/PATCH/DELETE - switchover,
# failover, restart, reinitialize) are UNAUTHENTICATED by default. Anyone who
# can reach port 8008 can fail over your cluster. Basic auth closes that.
# GET endpoints stay open by design - HAProxy health checks need them.
patroni_restapi_auth_enabled: true
patroni_restapi_username: "patroni"

# TLS for the Patroni REST API. Requires certificates to already exist at
# the paths below (this role does not run a CA for you).
patroni_restapi_tls_enabled: false
patroni_restapi_certfile: "/etc/patroni/ssl/server.crt"
patroni_restapi_keyfile: "/etc/patroni/ssl/server.key"
patroni_restapi_cafile: "/etc/patroni/ssl/ca.crt"

# etcd transport security. Plain HTTP with no auth means anyone who reaches
# port 2379 owns your cluster state. Enable in any real deployment.
etcd_tls_enabled: false
etcd_cert_dir: "/etc/etcd/ssl"
etcd_ca_file: "/etc/etcd/ssl/ca.crt"
etcd_cert_file: "/etc/etcd/ssl/server.crt"
etcd_key_file: "/etc/etcd/ssl/server.key"
etcd_auth_enabled: false
etcd_username: "patroni"

# PostgreSQL TLS. The distro snakeoil cert only encrypts - it proves nothing
# about server identity. Point these at real certs for production.
pg_ssl_enabled: true
# Empty = this role generates a self-signed pair in
# pg_ssl_self_signed_dir. "ssl = on" with no certificate at all is a hard
# PostgreSQL startup failure, and neither initdb nor Patroni creates one.
# A self-signed certificate only encrypts - it proves nothing about server
# identity, so clients cannot meaningfully use sslmode=verify-full against
# it. Point these at CA-issued certificates for that.
pg_ssl_cert_file: ""
pg_ssl_key_file: ""
pg_ssl_ca_file: ""
pg_ssl_self_signed_dir: "/etc/postgresql-ssl"
pg_ssl_self_signed_days: 3650
# Require TLS for all non-local connections in pg_hba (hostssl not host).
pg_require_ssl: false

# ============================================================================
# Backups (pgBackRest)
# ============================================================================
# Without this, archive_command is a no-op and you have NO point-in-time
# recovery and NO backups - only streaming replicas, which faithfully
# replicate an accidental DROP TABLE within milliseconds.
pgbackrest_enabled: true
pgbackrest_stanza: "{{ patroni_scope }}"
pgbackrest_repo_path: "/var/lib/pgbackrest"
# "posix" keeps backups on a local/NFS path. For real durability use an
# off-host repo: set pgbackrest_repo_type to s3/azure/gcs and fill in the
# credentials below from vault.
pgbackrest_repo_type: "posix"
pgbackrest_retention_full: 2
pgbackrest_retention_full_type: "count"   # count | time
pgbackrest_retention_diff: 6
pgbackrest_compress_type: "zst"
pgbackrest_compress_level: 3
pgbackrest_process_max: 4
pgbackrest_archive_async: true
pgbackrest_spool_path: "/var/spool/pgbackrest"
pgbackrest_archive_push_queue_max: "1GiB"
pgbackrest_log_path: "/var/log/pgbackrest"
# NOT pgBackRest's built-in default of /tmp/pgbackrest: systemd units with
# PrivateTmp=yes get a private /tmp, so the postmaster's archive-push
# processes and a hand-run pgbackrest end up with two different lock
# directories, which shows up as stale locks and "unable to acquire lock".
pgbackrest_lock_path: "/run/pgbackrest"
# When true the stanza lists every cluster node (pg1/pg2/pg3...), which is
# what backup-standby, remote `check` and cross-node restore need - and
# which requires passwordless SSH between the postgres users. Set false for
# a local-only stanza that needs no SSH at all.
pgbackrest_cluster_aware: true
# Generate an ed25519 key for the postgres user on every node and authorize
# all of them everywhere, so the pgN-host entries above actually work.
# Turn this off if you distribute those keys yourself.
pgbackrest_manage_ssh_keys: true
# Take backups from a standby so the primary isn't loaded.
pgbackrest_backup_standby: false
# systemd timers for scheduled backups (run only on the leader).
pgbackrest_schedule_enabled: true
pgbackrest_full_backup_schedule: "Sun *-*-* 01:00:00"
pgbackrest_diff_backup_schedule: "Mon..Sat *-*-* 01:00:00"
# S3 settings, used only when pgbackrest_repo_type == "s3"
pgbackrest_s3_bucket: ""
pgbackrest_s3_endpoint: ""
pgbackrest_s3_region: ""

# ============================================================================
# Virtual IP (keepalived)
# ============================================================================
# Without a VIP, HAProxy on a single node is a single point of failure and
# clients have to know every node's address. keepalived floats one address
# across the nodes so applications have a single stable endpoint.
keepalived_enabled: true
keepalived_vip: ""            # e.g. "10.0.0.10" - REQUIRED when enabled
keepalived_interface: "{{ ansible_default_ipv4.interface }}"
keepalived_virtual_router_id: 51
keepalived_auth_pass: "{{ vault_keepalived_auth_pass | default('') }}"

# ============================================================================
# Monitoring
# ============================================================================
monitoring_enabled: true
# Patroni exposes Prometheus metrics on its REST API at /metrics.
postgres_exporter_enabled: true
postgres_exporter_version: "0.15.0"
node_exporter_enabled: false

# ============================================================================
# Memory / performance tuning
# ============================================================================
pg_memory_budget_percent: 70
pg_shared_buffers_percent: 25
pg_effective_cache_size_percent: 75
pg_work_mem_percent: 2
pg_max_connections: 500

# Transparent huge pages hurt PostgreSQL latency; disable them.
disable_transparent_hugepages: true
# Kernel/sysctl tuning for a dedicated database host.
tune_kernel_parameters: true

# vm.overcommit_memory=2 stops the OOM killer from picking the postmaster
# (which takes the whole instance down rather than one backend), but it
# also hard-caps committed memory at swap + RAM*ratio/100. On a host with
# little swap, or one that runs anything else alongside PostgreSQL, that
# ceiling can start refusing allocations outright. The role warns when the
# numbers look tight; set vm_overcommit_memory: 0 to opt out.
vm_overcommit_memory: 2
vm_overcommit_ratio: 80
pg_sysctl_parameters:
  - { name: vm.overcommit_memory, value: "{{ vm_overcommit_memory }}" }
  - { name: vm.overcommit_ratio, value: "{{ vm_overcommit_ratio }}" }
  # Write back dirty pages steadily instead of in large stalling bursts.
  - { name: vm.dirty_background_ratio, value: "5" }
  - { name: vm.dirty_ratio, value: "10" }
  # Strongly prefer keeping the page cache over swapping.
  - { name: vm.swappiness, value: "1" }
  - { name: net.core.somaxconn, value: "4096" }
  - { name: net.ipv4.tcp_max_syn_backlog, value: "4096" }
  - { name: net.ipv4.tcp_keepalive_time, value: "300" }
  - { name: net.ipv4.tcp_keepalive_intvl, value: "30" }
  - { name: net.ipv4.tcp_keepalive_probes, value: "10" }
  - { name: fs.file-max, value: "2097152" }
pg_timezone: "Asia/Tehran"

# ============================================================================
# Networking / access control
# ============================================================================
pg_hba_extra_networks: []
manage_firewall: true
manage_selinux: true

# Require chrony/ntp to be running. Clock skew between nodes causes
# confusing Patroni TTL behaviour and unreadable correlated logs.
manage_time_sync: true

# ============================================================================
# Where things are downloaded from (mirrors / restricted networks)
# ============================================================================
# Every URL this role fetches from is a variable, so a host behind a
# filtered network - or one that is geoblocked by the upstream, which is
# the normal case for some of these from Iran - can be pointed at an
# internal mirror instead. See docs/offline-and-mirrors.md.
pgdg_apt_uri: "http://apt.postgresql.org/pub/repos/apt"
pgdg_apt_key_url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
pgdg_yum_repo_base_url: "https://download.postgresql.org/pub/repos/yum/reporpms"
pgdg_yum_repo_rpm: >-
  {{ pgdg_yum_repo_base_url }}/EL-{{ ansible_distribution_major_version }}-{{ ansible_architecture }}/pgdg-redhat-repo-latest.noarch.rpm
etcd_download_base_url: "https://github.com/etcd-io/etcd/releases/download"
github_api_url: "https://api.github.com"
rustup_install_url: "https://sh.rustup.rs"
postgres_exporter_download_base_url: "https://github.com/prometheus-community/postgres_exporter/releases/download"

# Preflight probes these before installing anything, so a blocked endpoint
# surfaces as one clear error instead of a half-built cluster.
preflight_check_connectivity: true
preflight_connectivity_timeout: 10
preflight_required_endpoints: >-
  {{
    ([{'what': 'PGDG apt repository', 'url': pgdg_apt_uri}]
       if ansible_os_family == 'Debian' else
     [{'what': 'PGDG yum repository', 'url': pgdg_yum_repo_rpm}])
    + ([{'what': 'etcd releases (GitHub)', 'url': etcd_download_base_url}]
       if is_cluster | default(false) else [])
    + ([{'what': 'GitHub API (etcd_version: latest)', 'url': github_api_url}]
       if (is_cluster | default(false) and etcd_version == 'latest') else [])
    + ([{'what': 'rustup (PgCat build)', 'url': rustup_install_url}]
       if (use_pgcat | default(false) and pgcat_build_from_source | bool
           and pgcat_binary_src | length == 0) else [])
  }}


# ============================================================================
# PgCat (only used when connection_mode == "pgcat" - see the decision block
# at the top of this file, and docs/PGCAT.md for the full picture)
# ============================================================================
# Pinned by default rather than "auto": PgCat is an actively-developed,
# partly-experimental project (per its own docs) with no stable package
# repo for either OS family, so this role builds it from source. Set to
# "latest" to always build the newest GitHub release instead.
pgcat_version: "v1.3.0"

# How the binary gets onto the nodes. Preferred: build PgCat somewhere that
# is not a production database server and set pgcat_binary_src to the path
# of that binary on the CONTROL node - it is then just copied out.
# Otherwise set pgcat_build_from_source: true to build on the database
# nodes themselves, which installs a Rust toolchain through `curl | sh` as
# root and needs 1-2GB of scratch space. Off by default for that reason.
pgcat_binary_src: ""
pgcat_build_from_source: false
# Where the control node stashes a binary built on the elected builder node
# before copying it to the others.
pgcat_fetch_dir: "/tmp/pgcat-builds"

# The single port your application connects to for BOTH reads and writes.
pgcat_port: 6433
pgcat_admin_username: "pgcat_admin"
pgcat_prometheus_port: 9930
pgcat_worker_threads: "{{ [ansible_processor_vcpus | default(4) | int, 4] | max }}"

pgcat_pool_mode: "transaction"
pgcat_query_parser_enabled: true
pgcat_query_parser_read_write_splitting: true
# false = replicas only serve reads while they're healthy; the primary is
# used for reads only when no replica is available. Set true to also
# spread some read load onto the primary even when replicas are healthy.
pgcat_primary_reads_enabled: false

# How often (seconds) every node re-checks Patroni's REST API for the
# current primary/replica topology and regenerates pgcat.toml if it
# changed. A Patroni on_role_change callback also triggers an immediate
# re-check on the node whose role just changed, so this interval is a
# safety net, not the only detection path.
pgcat_sync_interval_seconds: 5


# Declare the databases/roles your application needs and the role
# provisions them idempotently on the leader after bootstrap. Passwords
# reference vault_ variables you define in group_vars/all/vault.yml -
# never put literal passwords here.
#
# postgres_databases:
#   - name: app
#     owner: app_user
#
# postgres_users:
#   - name: app_user
#     password_var: vault_app_user_password   # name of the vault_ variable
#     login: true
postgres_databases: []
postgres_users: []

# ============================================================================
# Secrets - MUST be overridden via group_vars/all/vault.yml
# ============================================================================
vault_postgres_superuser_password: "CHANGE_ME"
vault_postgres_replicator_password: "CHANGE_ME"
vault_pgbouncer_password: "CHANGE_ME"
vault_patroni_restapi_password: "CHANGE_ME"
vault_etcd_password: "CHANGE_ME"
vault_keepalived_auth_pass: "CHANGE_ME"
vault_pgcat_admin_password: "CHANGE_ME"
