---
# Inventory for the PostgreSQL HA cluster (Patroni + etcd + HAProxy + PgBouncer).
# Replace ansible_host values with the real IPs/hostnames of your database
# nodes. Use an odd number of nodes (3, 5, ...) so etcd keeps quorum.
all:
  hosts:
    db1:
      ansible_host: 10.0.0.11
    db2:
      ansible_host: 10.0.0.12
    db3:
      ansible_host: 10.0.0.13

  vars:
    ansible_python_interpreter: /usr/bin/python3
    # ansible_user: ubuntu
    # ansible_ssh_private_key_file: ~/.ssh/id_ed25519
